title: OE5XRX
description: Amateurfunkclub für Remote Stationen

theme: just-the-docs
favicon_ico: /favicon.ico
color_scheme: oe5xrx
logo: "/assets/oe5xrx-logo.svg"

mermaid:
  version: "11.3.0"

defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"

gems:
- jekyll-email-protect

exclude:
  - docs/superpowers
  - README.md
  - LICENSE
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
